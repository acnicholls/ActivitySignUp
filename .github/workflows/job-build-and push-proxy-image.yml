name: build-and-push-proxy-image

on:
  workflow_call:

jobs:
  build-and-push-image:
    if: ${{ success() }}
    uses: ./github/workflows/job-build-and-push-image.yml
    name: build and push proxy image to cr
    runs-on: self-hosted
    with:
      container-registry: "ghcr.io"
      code-folder: "proxy"
      image-tag: "activity_proxy:latest"
