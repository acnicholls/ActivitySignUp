name: build-and-push-client-image

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

jobs:
  build-and-push-image:
    if: ${{ success() }}
    uses: ./.github/workflows/job-build-and-push-image.yml
    name: build and push client image to cr
    runs-on: "ubuntu-latest"
    with:
      container-registry: "ghcr.io"
      code-folder: "client"
      image-tag: "activity_client:${{ inputs.tag }}"
