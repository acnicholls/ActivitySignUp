name: build-and-push-client-image

on:
  workflow_call:

jobs:
  build-and-push-image:
    if: ${{ success() }}
    uses: ./github/workflows/job-build-and-push-image.yml
    name: build and push client image to cr
    runs-on: self-hosted
    with:
      container-registry: "ghcr.io"
      code-folder: "client"
      image-tag: "activity_client:latest"
