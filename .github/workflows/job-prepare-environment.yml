name: prepare-environment

on:
  workflow_call:
    inputs:
      sub-file-name:
        required: true
        type: string
    secrets:
      connectionstring:
        required: true

jobs:
  prepare-environment:
    runs-on: self-hosted
    steps:
      # get the latest code from the repo
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install dotnet
        env:
          DOTNET_INSTALL_DIR: "/home/git/.dotnet"
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.x"

      - name: Install node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # display environment variables, for audit purposes
      - name: Check Environment
        run: |
          printenv

      - name: Prepare application settings
        uses: microsoft/variable-substitution@v1
        with:
          files: "${{ inputs.sub-file-name }}"
        env:
          ConnectionStrings.ActivitySignUpDatabase_local: ${{ secrets.connectionstring }}
          ConnectionStrings.ActivitySignUpDatabase: ${{ secrets.connectionstring }}
