name: prepare-environment

on:
  workflow_call:
    inputs:
      sub-file-name:
        required: true
        type: string
    secrets:
      connectionstring:
        required: true

jobs:
  prepare-environment:
    runs-on: "ubuntu-latest"
    steps:
      # get the latest code from the repo
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install dotnet
        #        env:
        #          DOTNET_INSTALL_DIR: "/home/git/.dotnet"
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "3.1.x"

      #      - name: install lib ssl
      #        run: |
      #          apt-get update
      #          apt-get -y install libssl-dev libssl

      - name: Install node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # display environment variables, for audit purposes
      - name: Check Environment
        run: |
          printenv

      - name: Prepare application settings
        uses: microsoft/variable-substitution@v1
        with:
          files: "${{ inputs.sub-file-name }}"
        env:
          ConnectionStrings.ActivitySignUpDatabase: ${{ secrets.connectionstring }}
