name: build-and-push-api-image

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

jobs:
  build-and-push-api-image:
    if: ${{ success() }}
    uses: ./.github/workflows/job-build-and-push-image.yml
    name: build and push api image to cr
    with:
      container-registry: "ghcr.io"
      code-folder: "${{ github.workspace }}/api"
      image-name-with-tag: "activity_api:${{ inputs.tag }}"
      arch-types: "linux/arm64,linux/amd64"
      build-multi-platform: true
      docker-file-name: "Dockerfile.multi"
