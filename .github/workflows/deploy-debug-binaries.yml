# This script builds the debug binaries for activity-sign-up
# the images are then uploaded to github's CR
name: deploy-debug-binaries
run-name: Deploy Debug build for ${{ github.event_name }} triggered by ${{ github.triggering_actor }}
concurrency:
  group: debug-binaries
on:
  push:
    target_branches:
      - develop
    paths-ignore:
      - README.md
      - LICENSE
      - .gitignore
      - .github/**
  workflow_dispatch:
env:
  tag: "local"
  build-config: "local"
  dotnet-home: "/home/git/.dotnet"
  ASPNETCORE_ENVIRONMENT: "local"
  sln-path: "./api"
  sln-name: "ActivitySignUp.sln"
  node-project-home: "client/ActivitySignUpPortal"

jobs:
  prepare-variables:
    runs-on: self-hosted
    outputs:
      sub-file-name: ${{ steps.get-sub-file-name.outputs.sub-file-name }}
      env-name: ${{ steps.get-env-name.outputs.env-name }}
      dotnet-home: ${{ steps.get-dotnet-home.outputs.dotnet-home }}
    steps:
      - id: get-sub-file-name
        shell: bash
        run: echo "sub-file-name=./api/ActivitySignUpApi/appsettings.${{ env.build-config }}.json" >> $GITHUB_OUTPUT
      - id: get-env-name
        shell: bash
        run: echo "env-name=${{ env.build-config }}" >> $GITHUB_OUTPUT
      - id: get-dotnet-home
        shell: bash
        run: echo "dotnet-home=${{ env.dotnet-home }}" >> $GITHUB_OUTPUT

  prepare-environment:
    uses: ./.github/workflows/job-prepare-environment.yml
    needs: [prepare-variables]
    with:
      sub-file-name: ${{ needs.prepare-variables.outputs.sub-file-name }}
    secrets:
      connectionstring: ${{ secrets.local-connectionstring }}

  build-run-tests:
    uses: ./.github/workflows/job-build-and-run-tests.yml
    needs: [prepare-variables, prepare-environment]
    with:
      build-config: ${{ needs.prepare-variables.outputs.env-name }}
      dotnet-home: "${{ needs.prepare-variables.outputs.dotnet-home }}"

  build-api-image:
    if: ${{ success() }}
    uses: ./.github/workflows/job-build-and-push-api-image.yml
    needs: [prepare-variables, prepare-environment, build-run-tests]
    with:
      tag: ${{ env.tag }}

  build-client-image:
    if: ${{ success() }}
    uses: ./.github/workflows/job-build-and-push-client-image.yml
    needs: [prepare-variables, prepare-environment, build-run-tests]
    with:
      tag: ${{ env.tag }}

  build-proxy-image:
    if: ${{ success() }}
    uses: ./.github/workflows/job-build-and-push-proxy-image.yml
    needs: [prepare-variables, prepare-environment, build-run-tests]
    with:
      tag: ${{ env.tag }}

  build-db-image:
    if: ${{ success() }}
    uses: ./.github/workflows/job-build-and-push-db-image.yml
    needs: [prepare-variables, prepare-environment, build-run-tests]
    with:
      tag: ${{ env.tag }}
# now add a step to log into the server and restart the service.

