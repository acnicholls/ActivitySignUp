name: build-and-push-proxy-image

on:
  workflow_call:
    inputs:
      container-registry:
        required: true
        type: string
      image-name-with-tag:
        required: true
        type: string
      code-folder:
        required: true
        type: string
      arch-types:
        required: true
        type: string
      build-multi-platform:
        required: true
        type: boolean
      docker-file-name:
        required: true
        type: string

jobs:
  build-and-push-image:
    if: ${{ success() }}
    name: build and push to cr
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: "Login to Container Registry"
        uses: docker/login-action@v1
        with:
          registry: ${{ inputs.container-registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Build Image for multiple platforms"
        id: multi-platform-build
        if: ${{ inputs.build-multi-platform && success() }}
        run: |
          cd ${{ inputs.code-folder }}
          docker buildx build --rm --push --platform ${{ inputs.arch-types }} \
              -t ${{ inputs.image-name-with-tag }} \
              -f ./${{ inputs.docker-file-name }} \
              .
          docker image tag ${{ inputs.image-name-with-tag }} ${{ inputs.container-registry }}/${{ github.actor }}/${{ inputs.image-name-with-tag }}
          docker image push ${{ inputs.container-registry }}/${{ github.actor }}/${{ inputs.image-name-with-tag }}
          cd ..

      - name: "Build Image for single platform"
        id: single-platform-build
        if: ${{ !inputs.build-multi-platform && success() }}
        run: |
          cd ${{ inputs.code-folder }}
          docker build --rm --push --platform ${{ inputs.arch-types }} \
              -t ${{ inputs.image-name-with-tag }} \
              -f ./${{ inputs.docker-file-name }} \
              .
          docker image tag ${{ inputs.image-name-with-tag }} ${{ inputs.container-registry }}/${{ github.actor }}/${{ inputs.image-name-with-tag }}
          docker image push ${{ inputs.container-registry }}/${{ github.actor }}/${{ inputs.image-name-with-tag }}
          cd ..
