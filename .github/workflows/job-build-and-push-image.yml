name: build-and-push-proxy-image

on:
  workflow_call:
    inputs:
      container-registry:
        required: true
        type: string
      image-tag:
        required: true
        type: string
      code-folder:
        required: true
        type: string
      docker-file-name:
        required: true
        type: string

jobs:
  build-and-push-image:
    if: ${{ success() }}
    name: build and push to cr
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: "Login to Container Registry"
        uses: docker/login-action@v1
        with:
          registry: ${{ inputs.container-registry }}
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}

      - name: "Build Image"
        run: |
          cd ${{ inputs.code-folder }}
          docker buildx build --rm --push --platform linux/amd64,linux/arm64 \
              -t ${{ inputs.image-tag }} \
              -f ${{ inputs.docker-file-name }} \
              .
          docker image tag ${{ inputs.image-tag }} ${{ inputs.container-registry }}/${{ github.actor }}/${{ inputs.image-tag }}
          docker image push ${{ inputs.container-registry }}/${{ github.actor }}/${{ inputs.image-tag }}
          cd ..
