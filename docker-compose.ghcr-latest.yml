version: "3.8"

services:
  client:
    image: ghcr.io/activity_client:latest-amd64
    networks:
      activity:
        aliases:
          - client
  api:
    image: ghcr.io/activity_api:latest-amd64
    links:
      - db
    networks:
      activity:
        aliases:
          - api
  db:
    image: ghcr.io/activity_db:latest-amd64
    networks:
      activity:
        aliases:
          - db
    volumes:
      - db_data:/var/opt/mssql/data:rw
  proxy:
    image: ghcr.io/activity_proxy:latest-amd64
    ports:
      - 80:80
    links:
      - client
      - api
    networks:
      activity:
        aliases:
          - proxy

networks:
  activity:

volumes:
  db_data:
