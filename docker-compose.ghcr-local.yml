version: "3.8"

services:
  client:
    image: ghcr.io/acnicholls/activity_client:local-amd64
    ports:
      - 4200:4200
      - 49153:49153
    networks:
      activity:
        aliases:
          - client
  api:
    image: ghcr.io/acnicholls/activity_api:local-amd64
    ports:
      - 5000:5000    
    links:
      - db
    networks:
      activity:
        aliases:
          - api
  db:
    image: ghcr.io/acnicholls/activity_db:local-amd64
    ports:
      - 1433:1433
    networks:
      activity:
        aliases:
          - db
    volumes:
      - db_data:/var/opt/mssql/data:rw
  proxy:
    image: ghcr.io/acnicholls/activity_proxy:local-amd64
    ports:
      - 80:80
    links:
      - client
      - api
    networks:
      activity:
        aliases:
          - proxy

networks:
  activity:

volumes:
  db_data:
