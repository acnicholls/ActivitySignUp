version: "3.8"

services:
  client:
    container_name: client
    build:
      context: ./client
      dockerfile: Dockerfile.local
    image: activity_client:local-amd64
    volumes:
      - ./client/ActivitySignUpPortal:/app
    ports:
      - 4200:4200
    networks:
      activity:
        aliases:
          - client
  api:
    container_name: api
    build:
      context: ./api
      dockerfile: Dockerfile.local
    image: activity_api:local-amd64
    links:
      - db
    ports:
      - 5000:5000
      - 5001:5001
    networks:
      activity:
        aliases:  
          - api    
  db:
    container_name: db
    build:
      context: ./db
      dockerfile: Dockerfile.local
    image: activity_db:local-amd64
    ports:
      - 1433:1433    
    networks:
      activity:
        aliases:    
          - db
    volumes:
      - db_data:/var/opt/mssql/data:rw
  proxy:
    container_name: proxy
    build:
      context: ./proxy
      dockerfile: Dockerfile.local
    image: activity_proxy:local-amd64
    links:
      - client
      - api
    ports:
      - 80:80
    networks:
      activity:
        aliases:
          - proxy      

networks:
  activity:

volumes:
  db_data:
      